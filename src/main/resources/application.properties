spring.application.name=botica

# =====================================================
# Servidor
# =====================================================
server.port=9091

# =====================================================
# Base de datos PostgreSQL
# =====================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/botica_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================
# JPA / Hibernate
# =====================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Desactiva el lazy-loading fuera de sesion para evitar LazyInitializationException
spring.jpa.open-in-view=true

# =====================================================
# JWT
# =====================================================
# Clave Base64 de al menos 256 bits (32 bytes) para HS256
jwt.secret=dGhpcy1pcy1hLXNlY3VyZS1rZXktZm9yLWJvdGljYS12aXJnZW4tZGVsLWNhcm1lbg==
jwt.expiration=86400000

# =====================================================
# Serialización JSON - evitar referencias circulares
# =====================================================
spring.jackson.serialization.fail-on-empty-beans=false
